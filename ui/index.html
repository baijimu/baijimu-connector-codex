<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex 默认工作区</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="error" class="message error error-with-action" role="alert" hidden>
        <span id="error-text"></span>
        <button id="error-retry-button" class="button secondary compact" type="button" hidden>重试</button>
      </div>
      <div id="warning" class="message warning" role="status" hidden></div>
      <div id="legacy-home-migration" class="message warning error-with-action" role="status" hidden>
        <span id="legacy-home-message"></span>
        <button id="restore-external-home-button" class="button secondary compact" type="button">
          恢复外部 Codex 环境
        </button>
      </div>

      <div id="auth-switch-modal" class="modal-backdrop" hidden>
        <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="auth-switch-modal-title">
          <div class="modal-heading">
            <p class="eyebrow">认证通道</p>
            <h2 id="auth-switch-modal-title">切换认证通道</h2>
          </div>
          <p id="auth-switch-modal-message" class="modal-message">
            选择 ChatGPT 登录或一个百积木工作区授权。确认后只切换默认工作区的当前认证，不会启动 Codex。
          </p>
          <div id="auth-profile-list" class="profile-list modal-profile-list">
            <div class="empty-state">正在读取认证通道…</div>
          </div>
          <div class="modal-actions">
            <button id="auth-switch-cancel" class="button secondary" type="button">取消</button>
            <button id="auth-switch-confirm" class="button primary" type="button" disabled>确认切换</button>
          </div>
        </section>
      </div>

      <section id="codex-operation-progress" class="panel operation-panel" aria-live="polite" hidden>
        <div class="operation-heading">
          <span class="operation-spinner" aria-hidden="true"></span>
          <div>
            <strong id="codex-operation-title">正在处理默认工作区</strong>
            <p id="codex-operation-message">请稍候。</p>
          </div>
        </div>
      </section>

      <section id="management-workspace-panel" class="panel workspace-panel active-panel" aria-labelledby="workspace-title" hidden>
        <div class="section-heading workspace-heading">
          <div>
            <p class="eyebrow">工作区</p>
            <h2 id="workspace-title">Codex 默认工作区</h2>
          </div>
          <div class="workspace-heading-actions">
            <span id="workspace-auth-badge" class="status-badge neutral">读取中</span>
            <button id="restart-codex-button" class="button primary" type="button">重启 Codex</button>
          </div>
        </div>
        <p class="workspace-note">会话、历史、技能和其他 Codex 状态始终保留在这个工作区；切换只影响认证通道。</p>
        <div id="workspace-route-notice" class="workspace-route-notice" hidden>
          <span id="workspace-route-message"></span>
          <button id="workspace-route-action" class="button secondary compact" type="button" hidden>重新验证路由</button>
        </div>
        <div class="workspace-summary">
          <div class="workspace-current-channel">
            <span class="field-label">当前认证通道</span>
            <strong id="current-auth-channel">正在读取…</strong>
            <small id="current-auth-detail">正在确认当前 Codex 登录方式。</small>
          </div>
          <div class="workspace-home">
            <span class="field-label">Codex Home</span>
            <code id="workspace-codex-home">正在读取…</code>
          </div>
          <button
            id="auth-channel-toggle"
            class="button secondary"
            type="button"
            aria-haspopup="dialog"
            aria-controls="auth-switch-modal"
          >切换认证通道</button>
        </div>
      </section>
      <section id="setup-panel" class="panel setup-panel" aria-labelledby="setup-title" tabindex="-1">
        <div class="section-heading">
          <div>
            <p class="eyebrow">安装状态</p>
            <h2 id="setup-title">Codex 安装状态</h2>
          </div>
          <div class="section-heading-actions">
            <span id="runtime-status-badge" class="status-badge neutral">检查中</span>
            <button id="refresh-button" class="button secondary compact" type="button" hidden>刷新状态</button>
          </div>
        </div>
        <p id="setup-message" class="section-note setup-message">正在读取初始化状态…</p>
        <div id="setup-progress" class="setup-progress" hidden>
          <div class="setup-progress-heading">
            <strong id="setup-progress-label">等待初始化</strong>
            <span id="setup-progress-percent">0%</span>
          </div>
          <div
            id="setup-progress-track"
            class="setup-progress-track"
            role="progressbar"
            aria-label="Codex 初始化进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="setup-progress-bar" class="setup-progress-bar" style="width: 0%"></span>
          </div>
          <ol id="setup-step-list" class="setup-step-list" aria-label="Codex 初始化步骤"></ol>
        </div>
        <div id="setup-actions" class="form-actions">
          <p>这里仅负责 Codex 桌面环境的安装和修复；安装完成后将进入默认工作区。</p>
          <div class="setup-action-buttons">
            <button id="setup-action-button" class="button primary" type="button" hidden>重新安装并修复</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
