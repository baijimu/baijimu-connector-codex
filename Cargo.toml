[package]
name = "baijimu-connector-codex"
version = "1.2.20"
edition = "2021"
license = "MIT"
description = "Baijimu Local connector for Codex app-server."

[[bin]]
name = "baijimu-connector-codex"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml_edit = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
