<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Codex 桌面环境</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
      <div id="error" class="message error error-with-action" role="alert" hidden>
        <span id="error-text"></span>
        <button id="error-retry-button" class="button secondary compact" type="button" hidden>重试</button>
      </div>
      <div id="warning" class="message warning" role="status" hidden></div>
      <div id="legacy-home-migration" class="message warning error-with-action" role="status" hidden>
        <span id="legacy-home-message"></span>
        <button id="restore-external-home-button" class="button secondary compact" type="button">
          恢复外部 Codex 环境
        </button>
      </div>

      <div id="auth-switch-modal" class="modal-backdrop" hidden>
        <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="auth-switch-modal-title">
          <div class="modal-heading">
            <p class="eyebrow">确认启动</p>
            <h2 id="auth-switch-modal-title">启动 Codex</h2>
          </div>
          <p id="auth-switch-modal-message" class="modal-message"></p>
          <div class="modal-actions">
            <button id="auth-switch-cancel" class="button secondary" type="button">取消</button>
            <button id="auth-switch-confirm" class="button primary" type="button">确认启动</button>
          </div>
        </section>
      </div>

      <section id="integration-unavailable-panel" class="panel capability-panel" aria-labelledby="capability-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">能力状态</p>
            <h2 id="capability-title">Codex 桌面环境暂不可用</h2>
          </div>
          <button id="go-to-runtime-button" class="button primary" type="button">查看初始化进度</button>
        </div>
        <p id="capability-message" class="section-note capability-note">Codex 桌面环境会自动初始化，完成后即可选择工作区并启动。</p>
      </section>

      <section id="switch-progress" class="panel operation-panel" aria-live="polite" hidden>
        <div class="operation-heading">
          <span class="operation-spinner" aria-hidden="true"></span>
          <div>
            <strong>正在准备并启动 Codex</strong>
            <p id="switch-progress-message">停止当前进程、选择工作区状态目录，并重新启动验证。</p>
          </div>
        </div>
        <ol class="operation-steps" aria-label="Codex 启动步骤">
          <li>停止当前 Codex</li>
          <li>选择工作区状态目录</li>
          <li>重新启动并验证</li>
        </ol>
      </section>

      <section id="management-workspace-panel" class="panel workspace-panel" aria-label="Codex 工作区" hidden>
        <div id="auth-profile-list" class="profile-list">
          <div class="empty-state">正在读取可用工作区…</div>
        </div>
      </section>
      <section id="setup-panel" class="panel setup-panel" aria-labelledby="setup-title" tabindex="-1">
        <div class="section-heading">
          <div>
            <p class="eyebrow">安装与修复</p>
            <h2 id="setup-title">本机 Codex</h2>
          </div>
          <div class="section-heading-actions">
            <span id="runtime-status-badge" class="status-badge neutral">检查中</span>
            <button id="refresh-button" class="button secondary compact" type="button" hidden>刷新状态</button>
          </div>
        </div>
        <p id="setup-message" class="section-note setup-message">正在读取初始化状态…</p>
        <div id="setup-progress" class="setup-progress" hidden>
          <div class="setup-progress-heading">
            <strong id="setup-progress-label">等待初始化</strong>
            <span id="setup-progress-percent">0%</span>
          </div>
          <div
            id="setup-progress-track"
            class="setup-progress-track"
            role="progressbar"
            aria-label="Codex 初始化进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="setup-progress-bar" class="setup-progress-bar" style="width: 0%"></span>
          </div>
          <ol id="setup-step-list" class="setup-step-list" aria-label="Codex 初始化步骤"></ol>
        </div>
        <div id="setup-actions" class="form-actions">
          <p>首次初始化会自动开始。全新用户会把当前工作区绑定到默认 .codex；已有个人 .codex 时保持原样，工作区使用隔离目录。只有失败后才需要手动修复。</p>
          <div class="setup-action-buttons">
            <button id="setup-action-button" class="button primary" type="button" hidden>重新安装并修复</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
