name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Tag to repair or verify, or main for a non-publishing rehearsal"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish the immutable tagged release"
        required: true
        default: false
        type: boolean

concurrency:
  group: codex-local-app-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BAIJIMU_CLI_VERSION: "0.1.51"
  BAIJIMU_CLI_LINUX_SHA256: "d2300f0f79760de152310b7a390daeea69c0e5543dad3b8acca54056606d2cf7"
  BAIJIMU_CLI_LINUX_URL: "https://download.baijimu.com/managed-tool-artifacts/baijimu-cli/releases/v0.1.51/d2300f0f79760de152310b7a390daeea69c0e5543dad3b8acca54056606d2cf7/baijimu-cli-0.1.51-linux-x64.zip"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      ref: ${{ steps.release.outputs.ref }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      verify: ${{ steps.release.outputs.verify }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}

      - name: Validate immutable release identity
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event_name == 'push' && github.ref_name || inputs.release_ref }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$version"
          test "$(jq -r .version connector.json)" = "$version"
          test "$(jq -r .version package.json)" = "$version"
          test "$(jq -r .version package-lock.json)" = "$version"
          test "$(jq -r '.packages[""].version' package-lock.json)" = "$version"
          test "$(jq -r .source.type connector.json)" = github
          test "$(jq -r .source.repo connector.json)" = baijimu/baijimu-connector-codex
          test "$(jq -r .source.revision connector.json)" = "v$version"
          sha="$(git rev-parse HEAD)"
          publish=false
          tag="v$version"
          verify=false
          if [ "$PUBLISH_REQUESTED" = "true" ]; then
            publish=true
            test "$RELEASE_REF" = "$tag"
            test "$(git rev-list -n 1 "$tag")" = "$sha"
            git fetch --no-tags origin main
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              test "$(git rev-parse origin/main)" = "$sha"
            else
              git merge-base --is-ancestor "$sha" origin/main
              release_json=""
              release_error="$RUNNER_TEMP/release-view-error"
              for attempt in 1 2 3 4 5; do
                if release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName 2>"$release_error")"; then
                  break
                fi
                if grep -Eqi 'release not found|HTTP 404' "$release_error"; then
                  break
                fi
                test "$attempt" != 5 || { cat "$release_error" >&2; exit 1; }
                sleep "$attempt"
              done
              if [ -n "$release_json" ]; then
                test "$(printf '%s' "$release_json" | jq -r .tagName)" = "$tag"
                if [ "$(printf '%s' "$release_json" | jq -r .isDraft)" = "false" ]; then
                  verify=true
                fi
              fi
            fi
          fi
          {
            echo "publish=$publish"
            echo "ref=$RELEASE_REF"
            echo "sha=$sha"
            echo "tag=$tag"
            echo "verify=$verify"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Run repository quality gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked
          npm test


  build:
    if: needs.validate.outputs.verify != 'true'
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            runner: macos-15-intel
            platform_dir: macos
          - name: windows-x64
            runner: windows-latest
            platform_dir: windows-x86_64
          - name: linux-x64
            runner: ubuntu-22.04
            platform_dir: linux-x86_64
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install stable --no-self-update
          rustup default stable
          if [ "$RUNNER_OS" = macOS ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Build and test macOS universal binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
          mkdir -p "$RUNNER_TEMP/codex-local-app/bin/${{ matrix.platform_dir }}"
          lipo -create \
            target/aarch64-apple-darwin/release/baijimu-codex-desktop \
            target/x86_64-apple-darwin/release/baijimu-codex-desktop \
            -output "$RUNNER_TEMP/codex-local-app/bin/${{ matrix.platform_dir }}/baijimu-codex-desktop"
          chmod 755 "$RUNNER_TEMP/codex-local-app/bin/${{ matrix.platform_dir }}/baijimu-codex-desktop"

      - name: Sign macOS binary
        if: runner.os == 'macOS' && needs.validate.outputs.publish == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Xiaofeng Zhang (H82D8SYZ94)"
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            test -n "${!name}" || { echo "Missing $name" >&2; exit 1; }
          done
          certificate_path="$RUNNER_TEMP/codex-local-app-certificate.p12"
          keychain_path="$RUNNER_TEMP/codex-local-app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          binary="$RUNNER_TEMP/codex-local-app/bin/${{ matrix.platform_dir }}/baijimu-codex-desktop"
          bash tools/release/sign-macos-with-retry.sh "$binary" "$APPLE_SIGNING_IDENTITY"
          lipo -info "$binary"

      - name: Build and test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -D warnings"
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "installers\windows-configure-terminal-and-login.ps1").Path,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "Windows installer PowerShell syntax validation failed"
          }
          cargo test --locked
          cargo build --locked --release
          $binDir = Join-Path $env:RUNNER_TEMP "codex-local-app\bin\${{ matrix.platform_dir }}"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item -Force "target\release\baijimu-codex-desktop.exe" (Join-Path $binDir "baijimu-codex-desktop.exe")

      - name: Verify Windows binaries are self-contained
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $visualStudioRoot = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem `
            -Path "$visualStudioRoot\VC\Tools\MSVC" `
            -Filter "dumpbin.exe" `
            -File `
            -Recurse `
            -ErrorAction Stop | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) {
            throw "dumpbin.exe was not found"
          }

          $packageBinDir = Join-Path $env:RUNNER_TEMP "codex-local-app\bin\${{ matrix.platform_dir }}"
          $nativeFiles = @(
            Get-ChildItem -LiteralPath $packageBinDir -File -ErrorAction Stop |
              Where-Object { $_.Extension -in @(".exe", ".dll") }
          )
          if ($nativeFiles.Count -eq 0) {
            throw "No Windows executables or libraries were found in $packageBinDir"
          }
          foreach ($nativeFile in $nativeFiles) {
            $imports = (& $dumpbin.FullName /DEPENDENTS $nativeFile.FullName 2>&1) -join "`n"
            Write-Host $imports
            if ($imports -match '(?i)\b(?:VCRUNTIME|MSVCP)\d*(?:_\d+)?\.dll\b') {
              throw "Windows artifact requires the Visual C++ runtime: $($nativeFile.FullName)"
            }
          }
          Write-Host "Verified Windows artifacts do not require VCRUNTIME/MSVCP"

      - name: Download and run Windows signing tool
        if: runner.os == 'Windows' && needs.validate.outputs.publish == 'true'
        shell: pwsh
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("SSL_COM_USERNAME", "SSL_COM_PASSWORD", "SSL_COM_CREDENTIAL_ID", "SSL_COM_TOTP_SECRET")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
          }
          $zipPath = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri "https://ssl.com/wp-content/uploads/2024/10/CodeSignTool-v1.3.1-windows.zip" `
            -UserAgent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) GitHub-Actions" `
            -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile $zipPath
          $expected = "e45a9e6c2aac4cae16c114eb590a2196406681357eb587507c65cd3646b5330d"
          if ((Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant() -ne $expected) { throw "CodeSignTool checksum mismatch" }
          Expand-Archive -Force -Path $zipPath -DestinationPath $extractPath
          $tool = Get-ChildItem -Path $extractPath -Filter "CodeSignTool.bat" -Recurse -File | Select-Object -First 1
          if (-not $tool) { throw "Unable to locate CodeSignTool.bat" }
          $env:CODESIGN_TOOL_PATH = $tool.FullName
          $binary = Join-Path $env:RUNNER_TEMP "codex-local-app\bin\${{ matrix.platform_dir }}\baijimu-codex-desktop.exe"
          & "tools/release/sign-windows-artifact.ps1" -FilePath $binary
          if ((Get-AuthenticodeSignature -LiteralPath $binary).Status -ne "Valid") { throw "Invalid Windows signature" }

      - name: Build and test Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked
          cargo build --locked --release
          mkdir -p "$RUNNER_TEMP/codex-local-app/bin/${{ matrix.platform_dir }}"
          install -m 755 target/release/baijimu-codex-desktop \
            "$RUNNER_TEMP/codex-local-app/bin/${{ matrix.platform_dir }}/baijimu-codex-desktop"

      - name: Assemble and verify package
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/codex-local-app"
          cp connector.json README.md LICENSE "$package_dir/"
          cp -R ui "$package_dir/ui"
          node - "$package_dir" "$VERSION" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const [packageDir, expectedVersion] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(packageDir, "connector.json"), "utf8"));
          if (manifest.version !== expectedVersion) throw new Error("connector package version mismatch");
          if (manifest.id !== "com.baijimu.connector.codex" || manifest.name !== "Codex 桌面管理器") throw new Error("desktop connector identity mismatch");
          if (manifest.source?.type !== "github" || manifest.source?.repo !== "baijimu/baijimu-connector-codex" || manifest.source?.revision !== `v${expectedVersion}`) throw new Error("connector source identity mismatch");
          const methods = manifest.methods?.map(({ name, path, httpMethod }) => ({ name, path, httpMethod }));
          if (manifest.schemaVersion !== "2.0" || manifest.runtime?.type !== "process" || manifest.runtime?.processOwnership !== "host" || manifest.runtime?.healthCheck?.url !== "http://127.0.0.1:18110/readyz" || manifest.transport?.type !== "http" || JSON.stringify(methods) !== JSON.stringify([{ name: "status", path: "/healthz", httpMethod: "GET" }]) || manifest.remoteCapabilities !== undefined || manifest.events !== undefined || manifest.ui?.type !== "embedded") throw new Error("desktop manager package contract is invalid");
          const entry = path.resolve(packageDir, manifest.ui.entry);
          const uiRoot = path.resolve(packageDir, "ui");
          if (!entry.startsWith(uiRoot + path.sep) || !fs.statSync(entry).isFile()) throw new Error("connector UI entry is missing");
          for (const asset of ["app.js", "state.mjs", "styles.css"]) if (!fs.statSync(path.join(uiRoot, asset)).isFile()) throw new Error(`missing UI asset: ${asset}`);
          NODE
          binary_name=baijimu-codex-desktop
          test "$RUNNER_OS" != Windows || binary_name=baijimu-codex-desktop.exe
          "$package_dir/bin/${{ matrix.platform_dir }}/$binary_name" --version | grep -Fx "$VERSION"
          output="$RUNNER_TEMP/baijimu-codex-desktop-${VERSION}-${{ matrix.name }}.zip"
          cd "$package_dir"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Force -Path '*' -DestinationPath '$output'"
            checksum="$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath '$output').Hash.ToLowerInvariant()")"
          else
            zip -qr "$output" .
            checksum="$(shasum -a 256 "$output" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$checksum" "$(basename "$output")" > "$output.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-release-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/baijimu-codex-desktop-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip
            ${{ runner.temp }}/baijimu-codex-desktop-${{ needs.validate.outputs.version }}-${{ matrix.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

  prepare-release:
    if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.verify != 'true'
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download signed platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: codex-release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Create or verify draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release-assets"
          test "$(find "$dir" -maxdepth 1 -name '*.zip' -type f | wc -l | tr -d ' ')" = 3
          test "$(find "$dir" -maxdepth 1 -name '*.sha256' -type f | wc -l | tr -d ' ')" = 3
          for checksum_file in "$dir"/*.sha256; do
            (cd "$dir" && sha256sum -c "$(basename "$checksum_file")")
          done
          release_is_draft=false
          if release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName 2>/dev/null)"; then
            release_is_draft="$(printf '%s' "$release_json" | jq -r .isDraft)"
            test "$(printf '%s' "$release_json" | jq -r .tagName)" = "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
              --draft --title "Codex 桌面管理器 $VERSION" \
              --notes "Signed codex local application release $VERSION."
            release_is_draft=true
          fi
          existing="$RUNNER_TEMP/existing-release-assets"
          mkdir -p "$existing"
          for file in "$dir"/*; do
            name="$(basename "$file")"
            if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing" --pattern "$name" >/dev/null 2>&1; then
              cmp "$file" "$existing/$name" || { echo "immutable release asset differs: $name" >&2; exit 1; }
            else
              test "$release_is_draft" = true || { echo "published release is missing immutable asset: $name" >&2; exit 1; }
              gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done

  publish-oss:
    if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.verify != 'true'
    needs: [validate, build, prepare-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
    steps:
      - name: Download signed platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: codex-release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Install pinned ossutil
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          version=2.3.0
          checksum=3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a
          curl -fsSL --retry 5 "https://gosspublic.alicdn.com/ossutil/v2/${version}/ossutil-${version}-linux-amd64.zip" -o "$RUNNER_TEMP/ossutil.zip"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/ossutil.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ossutil.zip" -d "$RUNNER_TEMP/ossutil"
          install -m 0755 "$RUNNER_TEMP/ossutil/ossutil-${version}-linux-amd64/ossutil" "$RUNNER_TEMP/ossutil-bin"

      - name: Publish content-addressed OSS artifacts
        id: oss
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          bucket=baijimu-lowcode-public-20260420
          endpoint=oss-cn-beijing.aliyuncs.com
          public_base=https://download.baijimu.com
          prefix="local-app-artifacts/codex/releases/v${VERSION}"
          dir="$RUNNER_TEMP/release-assets"
          manifest="$RUNNER_TEMP/baijimu-codex-desktop-${VERSION}-oss-manifest.json"
          upload_one() {
            local platform="$1" arch="$2" name="$3" file="$dir/$3"
            local checksum object source downloaded sidecar sidecar_url downloaded_sidecar
            checksum="$(sha256sum "$file" | awk '{print $1}')"
            object="$prefix/$checksum/$name"
            source="$public_base/$object"
            downloaded="$RUNNER_TEMP/verify-$platform.zip"
            sidecar="$file.sha256"
            sidecar_url="$source.sha256"
            downloaded_sidecar="$RUNNER_TEMP/verify-$platform.zip.sha256"
            printf '%s  %s\n' "$checksum" "$name" > "$sidecar"
            if curl -fsSL --retry 3 "$source" -o "$downloaded" 2>/dev/null; then
              test "$(sha256sum "$downloaded" | awk '{print $1}')" = "$checksum"
            else
              "$RUNNER_TEMP/ossutil-bin" cp "$file" "oss://$bucket/$object" --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET" --endpoint "$endpoint" --region cn-beijing --force --no-progress --content-type application/zip --cache-control 'public,max-age=31536000,immutable' >/dev/null
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$source" -o "$downloaded"
              test "$(sha256sum "$downloaded" | awk '{print $1}')" = "$checksum"
            fi
            if curl -fsSL --retry 3 "$sidecar_url" -o "$downloaded_sidecar" 2>/dev/null; then
              cmp "$sidecar" "$downloaded_sidecar"
            else
              "$RUNNER_TEMP/ossutil-bin" cp "$sidecar" "oss://$bucket/$object.sha256" --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET" --endpoint "$endpoint" --region cn-beijing --force --no-progress --content-type 'text/plain; charset=utf-8' --cache-control 'public,max-age=31536000,immutable' >/dev/null
              curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$sidecar_url" -o "$downloaded_sidecar"
              cmp "$sidecar" "$downloaded_sidecar"
            fi
            jq -n --arg platform "$platform" --arg arch "$arch" --arg name "$name" --arg source "$source" --arg checksum "sha256:$checksum" '{platform:$platform,arch:$arch,name:$name,source:$source,checksum:$checksum}'
          }
          macos_name="baijimu-codex-desktop-${VERSION}-macos-universal.zip"
          windows_name="baijimu-codex-desktop-${VERSION}-windows-x64.zip"
          linux_name="baijimu-codex-desktop-${VERSION}-linux-x64.zip"
          artifacts="[$(upload_one macos universal "$macos_name"),$(upload_one windows x86_64 "$windows_name"),$(upload_one linux x86_64 "$linux_name")]"
          jq -n --arg version "$VERSION" --arg tag "$RELEASE_TAG" --argjson artifacts "$artifacts" '{schemaVersion:"1.0",applicationId:"codex",connectorId:"com.baijimu.connector.codex",releaseTag:$tag,version:$version,artifacts:$artifacts}' > "$manifest"
          manifest_url="$public_base/$prefix/manifest.json"
          existing_manifest="$RUNNER_TEMP/existing-oss-manifest.json"
          if curl -fsSL --retry 3 "$manifest_url" -o "$existing_manifest" 2>/dev/null; then
            diff -u <(jq -S . "$existing_manifest") <(jq -S . "$manifest")
          else
            "$RUNNER_TEMP/ossutil-bin" cp "$manifest" "oss://$bucket/$prefix/manifest.json" --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET" --endpoint "$endpoint" --region cn-beijing --force --no-progress --content-type application/json --cache-control 'public,max-age=31536000,immutable' >/dev/null
          fi
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$manifest_url" | jq -e --arg version "$VERSION" '.version == $version and (.artifacts | length) == 3' >/dev/null
          name="$(basename "$manifest")"
          existing_release_dir="$RUNNER_TEMP/existing-release-manifest"
          existing_release_manifest="$existing_release_dir/$name"
          mkdir -p "$existing_release_dir"
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing_release_dir" --pattern "$name" >/dev/null 2>&1; then
            diff -u <(jq -S . "$existing_release_manifest") <(jq -S . "$manifest")
          else
            gh release upload "$RELEASE_TAG" "$manifest" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload OSS manifest for market publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-release-oss-manifest
          path: ${{ runner.temp }}/baijimu-codex-desktop-${{ needs.validate.outputs.version }}-oss-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish-release:
    if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.verify != 'true'
    needs: [validate, publish-oss]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish complete GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = true ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi

  publish-market:
    if: needs.validate.outputs.publish == 'true' && needs.validate.outputs.verify != 'true'
    needs: [validate, publish-oss, publish-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download OSS manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: codex-release-oss-manifest
          path: ${{ runner.temp }}/oss-manifest

      - name: Install pinned official Baijimu CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/baijimu-cli.zip"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 \
            "$BAIJIMU_CLI_LINUX_URL" \
            -o "$archive"
          printf '%s  %s\n' "$BAIJIMU_CLI_LINUX_SHA256" "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/baijimu-cli"
          test "$("$RUNNER_TEMP/baijimu-cli/bin/baijimu" --version)" = "$BAIJIMU_CLI_VERSION"

      - name: Create immutable market version and submit review
        id: market
        shell: bash
        env:
          BAIJIMU_CLI: ${{ runner.temp }}/baijimu-cli/bin/baijimu
          LOCAL_APP_MARKET_PUBLISH_TOKEN: ${{ secrets.LOCAL_APP_MARKET_PUBLISH_TOKEN }}
          LOCAL_APP_OWNER_WORKSPACE_ID: ${{ vars.LOCAL_APP_OWNER_WORKSPACE_ID }}
          MARKET_PUBLICATION_STATUS_FILE: ${{ runner.temp }}/publication-status
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$LOCAL_APP_MARKET_PUBLISH_TOKEN"
          tools/release/publish-market.sh \
            "$VERSION" \
            connector.json \
            "$RUNNER_TEMP/oss-manifest/baijimu-codex-desktop-${VERSION}-oss-manifest.json"
          status="$(cat "$MARKET_PUBLICATION_STATUS_FILE")"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Verify release and published market state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_STATUS: ${{ steps.market.outputs.status }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets \
            | jq -e --arg version "$VERSION" '
              (.isDraft == false) and
              (.tagName == ("v" + $version)) and
              ([.assets[].name] | index("baijimu-codex-desktop-" + $version + "-macos-universal.zip") != null) and
              ([.assets[].name] | index("baijimu-codex-desktop-" + $version + "-windows-x64.zip") != null) and
              ([.assets[].name] | index("baijimu-codex-desktop-" + $version + "-linux-x64.zip") != null) and
              ([.assets[].name] | index("baijimu-codex-desktop-" + $version + "-oss-manifest.json") != null)'
          case "$PUBLICATION_STATUS" in
            PENDING_REVIEW)
              echo "market submission is pending independent review"
              ;;
            PUBLISHED)
              for target in 'macos&arch=aarch64' 'windows&arch=x86_64' 'linux&arch=x86_64'; do
                curl -fsS --retry 5 --retry-all-errors --retry-delay 3 \
                  "https://api.baijimu.com/lowcode3/api/local-app-market/apps/codex?platform=${target}&hostVersion=0.3.0&hostCapabilities=connector.setup.v1,connector.process.host-managed.v1,connector.managed-tool-dependencies.v1,connector.presentation.icon.v1" \
                  | jq -e --arg version "$VERSION" '
                    (.data // .).latestVersion.version == $version and
                    (.data // .).latestVersion.compatibility.compatible == true and
                    ((.data // .).latestVersion.source | startswith("https://download.baijimu.com/local-app-artifacts/codex/releases/v" + $version + "/")) and
                    all((.data // .).latestVersion.manifest.artifacts[]; .source | startswith("https://download.baijimu.com/local-app-artifacts/codex/releases/v" + $version + "/"))'
              done
              ;;
            *)
              echo "unexpected publication status: $PUBLICATION_STATUS" >&2
              exit 1
              ;;
          esac

  verify-published:
    if: needs.validate.outputs.verify == 'true'
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Check out immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download and verify published release and OSS artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/published-release"
          mkdir -p "$release_dir"
          release_json="$RUNNER_TEMP/published-release.json"
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets > "$release_json"; then
              break
            fi
            test "$attempt" != 5
            sleep "$attempt"
          done
          jq -e --arg version "$VERSION" '
              (.isDraft == false) and
              (.tagName == ("v" + $version)) and
              ([.assets[].name] | sort) == ([
                "baijimu-codex-desktop-" + $version + "-linux-x64.zip",
                "baijimu-codex-desktop-" + $version + "-linux-x64.zip.sha256",
                "baijimu-codex-desktop-" + $version + "-macos-universal.zip",
                "baijimu-codex-desktop-" + $version + "-macos-universal.zip.sha256",
                "baijimu-codex-desktop-" + $version + "-oss-manifest.json",
                "baijimu-codex-desktop-" + $version + "-windows-x64.zip",
                "baijimu-codex-desktop-" + $version + "-windows-x64.zip.sha256"
              ] | sort)' "$release_json" >/dev/null
          jq -r '.assets[] | [.name, .url] | @tsv' "$release_json" | while IFS=$'\t' read -r name url; do
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$url" -o "$release_dir/$name"
          done
          for checksum_file in "$release_dir"/*.zip.sha256; do
            (cd "$release_dir" && sha256sum -c "$(basename "$checksum_file")")
          done
          oss_manifest="$release_dir/baijimu-codex-desktop-${VERSION}-oss-manifest.json"
          jq -e --arg version "$VERSION" '
            .schemaVersion == "1.0" and
            .applicationId == "codex" and
            .connectorId == "com.baijimu.connector.codex" and
            .releaseTag == ("v" + $version) and
            .version == $version and
            (.artifacts | length) == 3' "$oss_manifest" >/dev/null
          jq -c '.artifacts[]' "$oss_manifest" | while IFS= read -r artifact; do
            platform="$(printf '%s' "$artifact" | jq -r .platform)"
            source="$(printf '%s' "$artifact" | jq -r .source)"
            expected="$(printf '%s' "$artifact" | jq -r '.checksum | sub("^sha256:"; "")')"
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 "$source" -o "$RUNNER_TEMP/oss-$platform.zip"
            test "$(sha256sum "$RUNNER_TEMP/oss-$platform.zip" | awk '{print $1}')" = "$expected"
          done

      - name: Install pinned official Baijimu CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/baijimu-cli.zip"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 3 \
            "$BAIJIMU_CLI_LINUX_URL" \
            -o "$archive"
          printf '%s  %s\n' "$BAIJIMU_CLI_LINUX_SHA256" "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/baijimu-cli"
          test "$("$RUNNER_TEMP/baijimu-cli/bin/baijimu" --version)" = "$BAIJIMU_CLI_VERSION"

      - name: Verify immutable market version
        shell: bash
        env:
          BAIJIMU_CLI: ${{ runner.temp }}/baijimu-cli/bin/baijimu
          LOCAL_APP_MARKET_PUBLISH_TOKEN: ${{ secrets.LOCAL_APP_MARKET_PUBLISH_TOKEN }}
          LOCAL_APP_OWNER_WORKSPACE_ID: ${{ vars.LOCAL_APP_OWNER_WORKSPACE_ID }}
          MARKET_PUBLICATION_STATUS_FILE: ${{ runner.temp }}/publication-status
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tools/release/publish-market.sh "$VERSION" connector.json "$RUNNER_TEMP/published-release/baijimu-codex-desktop-${VERSION}-oss-manifest.json"
          test "$(cat "$MARKET_PUBLICATION_STATUS_FILE")" = "PUBLISHED"
